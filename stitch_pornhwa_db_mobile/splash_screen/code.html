<script>
  (function() {
    const bar = document.getElementById('splash-loader-bar');
    const label = document.getElementById('splash-status-text');
    if (!bar || !label) return;

    const stages = [
      { progress: '52%', text: 'Verifying local database integrity...' },
      { progress: '78%', text: 'Fetching chapter index delta...' },
      { progress: '94%', text: 'Decrypting library credentials...' },
      { progress: '100%', text: 'Ready' }
    ];

    let current = 0;
    const interval = setInterval(() => {
      if (current < stages.length) {
        bar.style.width = stages[current].progress;
        label.textContent = stages[current].text;
        current++;
      } else {
        clearInterval(interval);
      }
    }, 700);
  })();
