<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#181214;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed": "#2c1031", "outline": "#a18b91", "surface": "#181214", "on-tertiary": "#432647", "surface-container-high": "#30282a", "surface-container-lowest": "#130c0f", "on-error": "#690005", "inverse-on-surface": "#362e31", "tertiary-fixed-dim": "#e2bae4", "tertiary-container": "#745378", "inverse-primary": "#9b3e64", "outline-variant": "#544247", "on-error-container": "#ffdad6", "tertiary": "#e2bae4", "on-primary-fixed": "#3e001f", "on-surface-variant": "#d9c0c6", "secondary-fixed-dim": "#e2bdc7", "surface-dim": "#181214", "on-primary-fixed-variant": "#7d264c", "on-secondary-fixed": "#2a151c", "on-secondary": "#422a31", "surface-tint": "#ffb0ca", "on-tertiary-container": "#f5cbf6", "on-primary-container": "#ffccdb", "primary-fixed-dim": "#ffb0ca", "tertiary-fixed": "#fed6ff", "on-secondary-fixed-variant": "#5a3f48", "primary-container": "#9b3e64", "surface-container": "#251e20", "on-background": "#eddfe2", "secondary-container": "#5a3f48", "surface-bright": "#40373a", "surface-variant": "#3b3335", "secondary-fixed": "#ffd9e3", "background": "#181214", "surface-container-low": "#211a1c", "surface-container-highest": "#3b3335", "inverse-surface": "#eddfe2", "on-secondary-container": "#d0acb6", "error": "#ffb4ab", "on-surface": "#eddfe2", "primary-fixed": "#ffd9e3", "primary": "#ffb0ca", "secondary": "#e2bdc7", "on-tertiary-fixed-variant": "#5b3c5f", "error-container": "#93000a", "on-primary": "#600c35" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-2xl": "2rem", "gutter": "0.75rem", "gutter-mobile": "0.75rem", "space-lg": "1rem", "gutter-tablet": "1rem", "space-md": "0.75rem", "space-xl": "1.5rem", "space-xs": "0.25rem", "margin": "1rem" }, "fontFamily": { "overline": ["Inter"], "headline-lg": ["Inter"], "caption": ["Inter"], "headline-md": ["Inter"], "display": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"] }, "fontSize": { "overline": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.05em", "fontWeight": "600" }], "headline-lg": ["1.5rem", { "lineHeight": "2rem", "fontWeight": "700" }], "caption": ["0.8125rem", { "lineHeight": "1.125rem", "fontWeight": "400" }], "headline-md": ["1.25rem", { "lineHeight": "1.75rem", "fontWeight": "700" }], "display": ["1.75rem", { "lineHeight": "2.25rem", "fontWeight": "700" }], "body-md": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "400" }], "headline-sm": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-2xl space-y-space-lg text-on-surface">
<!-- Target Series Context -->
<div class="flex items-center space-x-space-md p-space-md bg-surface-container rounded-xl">
<div class="relative w-14 aspect-[2/3] rounded-lg overflow-hidden shrink-0 bg-surface-container-high">
<img class="w-full h-full object-cover" data-alt="Digital webtoon visual cover art for Secret Class manga featuring high contrast dramatic noir lighting in deep crimson, charcoal and muted rose tones, clean illustrative modern manhwa aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCSRGm2nhrOVCrsrKHS0L11g3p7rKHt2eRyTYJNejXTn5Pba3KtfZc_hUuWKouz8IgqsGM0ZSaYd98Hadu_yL-orSgBGdv1nydJz9IAfsDd60GHGZFhfB5uw1PgNmN1jg1WeeR9Hi4dqvCUy-XtTHBI4n-CTFhDlaF2x2J_EpXZ0GAErNt4qUxtfEI990GC5nnqxHkmDR1HblstDurVxLAX_1XuMM_pLJdUjRWaJAhogx9zEi9MXhmZ"/>
</div>
<div class="flex flex-col min-w-0 flex-1 justify-center">
<div class="flex items-center space-x-space-xs mb-0.5">
<span class="font-headline-sm text-headline-sm text-on-surface truncate">Secret Class</span>
<span class="px-1.5 py-0.5 rounded bg-surface-container-highest text-primary font-overline text-overline shrink-0">Ongoing</span>
</div>
<p class="font-caption text-caption text-on-surface-variant truncate">Min-woo &amp; G-Bro</p>
<div class="flex items-center space-x-space-xs mt-1">
<span class="material-symbols-outlined text-outline text-sm" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-caption text-caption text-on-surface-variant">Ch. 182 / 191</span>
</div>
</div>
</div>
<!-- Interactive Rating Selector Card -->
<div class="flex flex-col items-center justify-center p-space-lg bg-surface-container rounded-xl text-center">
<span class="font-overline text-overline uppercase tracking-wider text-outline mb-space-xs">Your Rating</span>
<div class="flex items-baseline space-x-space-xs">
<span class="font-display text-display text-primary font-bold" id="score-text">4.5</span>
<span class="font-headline-sm text-headline-sm text-outline">/ 5.0</span>
</div>
<span class="font-caption text-caption text-primary font-medium mt-0.5 mb-space-md" id="score-label">Masterpiece Storytelling</span>
<!-- 5 Star Picker Interactive -->
<div class="flex items-center justify-center space-x-2 py-space-xs" id="star-rating-container">
<button class="star-btn transition-transform active:scale-90 focus:outline-none" data-val="1" type="button">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 focus:outline-none" data-val="2" type="button">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 focus:outline-none" data-val="3" type="button">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 focus:outline-none" data-val="4" type="button">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 focus:outline-none" data-val="5" type="button">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">star_half</span>
</button>
</div>
<!-- Reading Milestone Chip -->
<button class="inline-flex items-center space-x-space-xs mt-space-md px-space-md py-1.5 rounded-full bg-surface-container-high text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm">bookmark_added</span>
<span class="font-caption text-caption">Reviewed at Chapter 182</span>
<span class="material-symbols-outlined text-xs text-outline">edit</span>
</button>
</div>
<!-- Review Title Input -->
<div class="flex flex-col space-y-space-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1 font-semibold">Review Headline</label>
<div class="bg-surface-container rounded-xl px-space-md py-space-sm flex items-center">
<input class="w-full bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" placeholder="Headline or summary (optional)" type="text" value="Pacing stepped up noticeably in latest arc"/>
</div>
</div>
<!-- Review Body Area & Formatting Mini-Toolbar -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between ml-1">
<label class="font-caption text-caption text-on-surface-variant font-semibold">Detailed Review</label>
<span class="font-caption text-caption text-outline" id="char-counter">428 / 2,000</span>
</div>
<div class="bg-surface-container rounded-xl flex flex-col overflow-hidden">
<!-- Mini Formatting Toolbar -->
<div class="flex items-center space-x-1 px-space-sm py-1.5 bg-surface-container-high">
<button class="p-1 rounded hover:bg-surface-bright text-on-surface-variant transition-colors flex items-center justify-center" title="Bold" type="button">
<span class="material-symbols-outlined text-base">format_bold</span>
</button>
<button class="p-1 rounded hover:bg-surface-bright text-on-surface-variant transition-colors flex items-center justify-center" title="Italic" type="button">
<span class="material-symbols-outlined text-base">format_italic</span>
</button>
<button class="p-1 rounded hover:bg-surface-bright text-on-surface-variant transition-colors flex items-center justify-center" title="Quote" type="button">
<span class="material-symbols-outlined text-base">format_quote</span>
</button>
<div class="w-px h-4 bg-outline-variant mx-1"></div>
<button class="px-2 py-0.5 rounded text-primary font-caption text-caption bg-surface-container-highest hover:bg-surface-bright transition-colors flex items-center space-x-1" title="Spoiler Tag" type="button">
<span class="material-symbols-outlined text-sm">visibility_off</span>
<span>Spoiler</span>
</button>
</div>
<!-- Textarea -->
<textarea class="w-full bg-transparent p-space-md text-on-surface placeholder:text-outline font-body-md text-body-md resize-none focus:outline-none leading-relaxed" maxlength="2000" placeholder="Share what worked, how the character dynamics evolved, and whether the art keeps its rhythm..." rows="6">The current arc finally provides the payoff for the long build-up. Dae-ho's confrontations carry real stakes now instead of repetitive filler, and the composition of full-page panels in Ch. 180-182 displays noticeable improvements in anatomical fidelity and shadow depth. The background art still reuses a few standard 3D assets, but the emotional tension keeps it among the strongest serialized releases right now.</textarea>
</div>
</div>
<!-- Quick Tags / Aspects Chips -->
<div class="flex flex-col space-y-space-xs">
<span class="font-caption text-caption text-on-surface-variant ml-1 font-semibold">Aspects Highlighted</span>
<div class="flex flex-wrap gap-space-xs pt-1">
<button class="aspect-chip px-3 py-1.5 rounded-full font-caption text-caption transition-all bg-primary-container text-on-primary-container font-medium" data-active="true" type="button">
        Story
      </button>
<button class="aspect-chip px-3 py-1.5 rounded-full font-caption text-caption transition-all bg-primary-container text-on-primary-container font-medium" data-active="true" type="button">
        Art Quality
      </button>
<button class="aspect-chip px-3 py-1.5 rounded-full font-caption text-caption transition-all bg-primary-container text-on-primary-container font-medium" data-active="true" type="button">
        Character Growth
      </button>
<button class="aspect-chip px-3 py-1.5 rounded-full font-caption text-caption transition-all bg-surface-container-high text-on-surface-variant hover:text-on-surface" data-active="false" type="button">
        Pacing
      </button>
<button class="aspect-chip px-3 py-1.5 rounded-full font-caption text-caption transition-all bg-surface-container-high text-on-surface-variant hover:text-on-surface" data-active="false" type="button">
        Romance
      </button>
<button class="aspect-chip px-3 py-1.5 rounded-full font-caption text-caption transition-all bg-surface-container-high text-on-surface-variant hover:text-on-surface" data-active="false" type="button">
        Drama
      </button>
</div>
</div>
<!-- Spoiler Warning Toggle Card -->
<div class="flex items-center justify-between p-space-md bg-surface-container rounded-xl">
<div class="flex items-start space-x-space-md pr-space-xs">
<div class="p-2 rounded-lg bg-surface-container-high text-primary shrink-0 mt-0.5">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface">Contains Spoilers</span>
<span class="font-caption text-caption text-on-surface-variant mt-0.5">Hide review text behind a tap-to-reveal spoiler overlay for fellow readers</span>
</div>
</div>
<!-- Custom Toggle Switch -->
<button aria-pressed="true" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full bg-primary transition-colors focus:outline-none" id="spoiler-toggle" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-on-primary shadow-sm transition-transform translate-x-5 mt-0.5 ml-0.5" id="spoiler-thumb"></span>
</button>
</div>
<!-- Bottom Actions -->
<div class="pt-space-sm flex flex-col space-y-space-md">
<button class="w-full h-12 rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm font-semibold flex items-center justify-center space-x-space-xs hover:bg-primary-fixed-dim active:scale-[0.99] transition-all shadow-md" type="button">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">send</span>
<span>Publish Review</span>
</button>
<button class="w-full text-center font-caption text-caption text-on-surface-variant hover:text-on-surface transition-colors py-1 focus:outline-none" type="button">
      Save as Draft
    </button>
</div>
</div>
<script>
  // Quick Tags Toggle Behavior
  document.querySelectorAll('.aspect-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const isActive = chip.getAttribute('data-active') === 'true';
      if (isActive) {
        chip.setAttribute('data-active', 'false');
        chip.classList.remove('bg-primary-container', 'text-on-primary-container');
        chip.classList.add('bg-surface-container-high', 'text-on-surface-variant');
      } else {
        chip.setAttribute('data-active', 'true');
        chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
        chip.classList.add('bg-primary-container', 'text-on-primary-container');
      }
    });
  });

  // Spoiler Toggle Switch Interaction
  const spoilerToggle = document.getElementById('spoiler-toggle');
  const spoilerThumb = document.getElementById('spoiler-thumb');
  if (spoilerToggle && spoilerThumb) {
    spoilerToggle.addEventListener('click', () => {
      const isPressed = spoilerToggle.getAttribute('aria-pressed') === 'true';
      if (isPressed) {
        spoilerToggle.setAttribute('aria-pressed', 'false');
        spoilerToggle.classList.remove('bg-primary');
        spoilerToggle.classList.add('bg-surface-container-highest');
        spoilerThumb.classList.remove('translate-x-5', 'bg-on-primary');
        spoilerThumb.classList.add('translate-x-0.5', 'bg-outline');
      } else {
        spoilerToggle.setAttribute('aria-pressed', 'true');
        spoilerToggle.classList.remove('bg-surface-container-highest');
        spoilerToggle.classList.add('bg-primary');
        spoilerThumb.classList.remove('translate-x-0.5', 'bg-outline');
        spoilerThumb.classList.add('translate-x-5', 'bg-on-primary');
      }
    });
  }

  // Interactive Star Rating Micro-Interaction
  const starBtns = document.querySelectorAll('.star-btn');
  const scoreText = document.getElementById('score-text');
  const scoreLabel = document.getElementById('score-label');
  const ratingLabels = {
    1: 'Needs Major Rework',
    2: 'Mediocre Pace & Art',
    3: 'Average Serialized Read',
    4: 'Great & Highly Recommended',
    5: 'Masterpiece Storytelling'
  };

  starBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const val = parseInt(btn.getAttribute('data-val'), 10);
      scoreText.textContent = val.toFixed(1);
      scoreLabel.textContent = ratingLabels[val] || 'Recommended';

      starBtns.forEach(b => {
        const bVal = parseInt(b.getAttribute('data-val'), 10);
        const icon = b.querySelector('.material-symbols-outlined');
        if (bVal <= val) {
          icon.textContent = 'star';
          icon.style.fontVariationSettings = "'FILL' 1";
          icon.classList.remove('text-outline');
          icon.classList.add('text-primary');
        } else {
          icon.textContent = 'star';
          icon.style.fontVariationSettings = "'FILL' 0";
          icon.classList.remove('text-primary');
          icon.classList.add('text-outline');
        }
      });
    });
  });
</script></main></body></html>
