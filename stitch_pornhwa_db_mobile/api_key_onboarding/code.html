<!-- Interactive script for showing/hiding key -->
<script>
    const input = document.getElementById('api_key_input');
    const toggleBtn = document.getElementById('toggle_visibility_btn');
    const icon = document.getElementById('visibility_icon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = input.getAttribute('type') === 'password';
      input.setAttribute('type', isPassword ? 'text' : 'password');
      icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      icon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
    });
  </script>
